name: frozen_collections
description: Immutable snapshots of Dart lists, sets, and maps with content-based equality and helpers to convert to and from mutable collections.
version: 0.1.4
repository: https://github.com/mofua-suki/immutable-collections
topics:
  - collections
  - immutability
  - value-equality

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  equatable: '>=2.1.0 <4.0.0'
  meta: ^1.19.0

dev_dependencies:
  test: ^1.32.0
